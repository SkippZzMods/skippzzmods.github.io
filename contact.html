            </div>

            <div class="relative inline-flex items-center gap-x-2 mb-1 group cursor-pointer select-none" id="email-copy-trigger" tabindex="0" role="button" aria-label="Copy email address skippzzofficial@gmail.com to clipboard">
                <h2 class="text-2xl text-text-subtitle italic underline font-semibold transition duration-150 group-hover:text-text-hover group-focus-visible:text-text-hover">
                    skippzzofficial@gmail.com

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-text-subtitle transition duration-150 group-hover:text-text-hover group-focus-visible:text-text-hover">

                </span>
            </div>

            <!--Contact links-->

                <a href="mailto:skippzzofficial@gmail.com" class="group flex flex-col items-center gap-y-2 p-3 rounded-lg opacity-0 animate-from-left transition duration-150 hover:scale-105 hover:text-text-hover focus-visible:scale-105 focus-visible:text-text-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-text-hover">

    <footer>
        <p class="text-2xl italic text-text-muted mb-4 text-center pre-animate">
            Thank you for your consideration
        </p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animate-in');
            }
            });
        });

        document.querySelectorAll('.pre-animate').forEach(el => observer.observe(el));

        const emailTrigger = document.getElementById('email-copy-trigger');
        const copyTooltip = document.getElementById('copy-tooltip');
        const emailAddress = 'skippzzofficial@gmail.com';

        function copyEmailToClipboard() {
            navigator.clipboard.writeText(emailAddress).then(() => {
                copyTooltip.textContent = 'Copied!';
            }).catch(() => {
                copyTooltip.textContent = 'Copy failed';
            });
        }

        if (emailTrigger) {
            emailTrigger.addEventListener('mouseenter', copyEmailToClipboard);
            emailTrigger.addEventListener('focus', copyEmailToClipboard);
        }
    </script>
</body>
